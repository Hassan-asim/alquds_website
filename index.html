const home=()=>`<section class="hero ph" ${bgs('home')}><div><span class="eb">Real Estate &amp; Construction · Overseas Pakistanis</span><h1 class="serif">${esc(S.h1)}</h1><p>${esc(S.hp)}</p><button class="btn" onclick="go('construction')">Explore Construction</button><a class="btn wa" href="${wa('Hello Al-Quds, I would like some information.')}" target="_blank" rel="noopener">Chat on WhatsApp</a></div><button class="cue" onclick="document.querySelector('.stats').scrollIntoView({behavior:'smooth'})" aria-label="Scroll down">↓</button></section><div class="stats">${S.stats.map(s=>`<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div><section><span class="eb">Featured</span><h2 class="serif">Latest listings.</h2>${cards(items.filter(i=>i.cat!='stay').slice(0,6))}</section>`;
const cons=()=>`<header class="ph" ${bgs('construction')}><span class="eb">Construction</span><h2 class="serif">House on a turn-key basis.</h2><p class="lead">Three finishing tiers, one fixed structural standard beneath all of them.</p></header><section class="body"><div class="two"><div><h3 class="serif">Standard Class</h3><p class="lead">Raft foundation, RCC (1:2:4), No.1 brickwork, copper wiring, PPR plumbing, marble flooring.</p></div><div><h3 class="serif">Luxury Class</h3><p class="lead">Imported tiles and granite, custom doors, Italian-style kitchen, LED elevation lighting.</p></div><div><h3 class="serif">Supreme Class</h3><p class="lead">Full 3D elevation, Italian acrylic cabinetry, imported stone, automatic generator.</p></div><div><h3 class="serif">Basic &amp; Grey Structure</h3><p class="lead">Receive the structure at the stage that suits your budget and finish it yourself.</p></div></div><p style="margin-top:28px"><button class="btn" onclick="go('calc')">Estimate Your Build →</button></p></section>`;

/* calculator */
const CL={basic:'Basic Structure',grey:'Grey Structure',standard:'Standard Class (Turn-Key)',luxury:'Luxury Class (Turn-Key)',supreme:'Supreme Class (Turn-Key)'};
const calc=()=>`<header class="ph" ${bgs('calc')}><span class="eb">Estimate Your Build</span><h2 class="serif">Construction cost calculator.</h2><p class="lead">Enter your plot and choices — the estimate updates instantly. It is a planning figure; the binding quotation is prepared from your drawings.</p></header><section class="body">
<div class="two"><div><div class="f"><div><label for="cs">Plot size</label><input id="cs" type="number" min="1" step="0.5" value="10" inputmode="decimal"></div><div><label for="cu">Unit</label><select id="cu"><option value="1">Marla</option><option value="20">Kanal (20 marla)</option></select></div></div>
<label for="cm">Marla standard</label><select id="cm"><option value="272.25">272.25 sqft (CDA / Punjab)</option><option value="225">225 sqft (older / some societies)</option></select>
<label for="cf">Floors above ground (incl. ground)</label><select id="cf"><option value="1">Single story</option><option value="2">Double story</option><option value="3">Triple story</option></select>
<label class="chk"><input type="checkbox" id="cb">Add a basement</label>
<label for="ct">Construction type</label><select id="ct">${Object.entries(CL).map(([k,v])=>`<option value="${k}" ${k=='standard'?'selected':''}>${v}</option>`).join('')}</select>
<div class="f"><div><label for="cc">Ground coverage % <span class="small">(auto)</span></label><input id="cc" type="number" min="30" max="100" step="1"></div><div><label for="co">Covered area override (sqft)</label><input id="co" type="number" min="0" placeholder="Optional" inputmode="numeric"></div></div></div>
<div><div class="small" style="letter-spacing:.14em;text-transform:uppercase">Estimated total</div><div class="amt" id="rt">—</div><p class="small" id="rf"></p><p class="small" id="rr" style="margin-top:6px"></p><div id="rw"></div><div class="bd" id="rb"></div><p style="margin-top:22px"><a class="btn wa" id="rwa" target="_blank" rel="noopener">Send this estimate on WhatsApp</a></p></div></div><div class="ms" id="ms"></div>
<p class="small" style="margin-top:16px">Rates are per covered sqft and include materials and labour for the selected class, boundary wall, water tanks and septic. Upper floors are assumed to match the ground-floor footprint. Basement is priced at ${S.basementMult}× the normal rate; the estimate includes a ${S.contingency}% contingency.</p></section>`;
const fmt=n=>'PKR '+Math.round(n).toLocaleString('en-PK'),short=n=>n>=1e7?'PKR '+(n/1e7).toFixed(2)+' Cr':n>=1e5?'PKR '+(n/1e5).toFixed(2)+' Lakh':fmt(n);
function recalc(){if(!$('cs'))return;const g=id=>$(id),w=[];let size=parseFloat(g('cs').value);if(!(size>0)){size=0;w.push('Enter a plot size greater than zero.')}
const unit=+g('cu').value,ms=+g('cm').value,marla=size*unit;if(marla>400){w.push('Very large plot — please contact us for a custom quotation.')}
const plot=marla*ms;let cov=parseFloat(g('cc').value);if(!g('cc').dataset.m||!(cov>0)){cov=marla<=5?85:marla<=10?75:marla<=20?65:55;g('cc').value=cov;g('cc').dataset.m=''}cov=Math.min(100,Math.max(30,cov));
const fl=+g('cf').value,base=plot*cov/100,ov=parseFloat(g('co').value),area=ov>0?ov:base*fl,bs=g('cb').checked?(ov>0?ov/fl:base):0;
const t=g('ct').value,rate=S.rates[t],grey=Math.min(S.rates.grey,rate),mult=S.basementMult;
const above=area*rate,bsm=bs*rate*mult,sub=above+bsm,cont=sub*S.contingency/100,tot=sub+cont,lo=tot*(1-S.band/100),hi=tot*(1+S.band/100);
const structPart=(area*grey)+(bs*grey*mult),finPart=Math.max(0,above-area*grey)+Math.max(0,bsm-bs*grey*mult);
$('rt').textContent=tot>0?short(tot):'—';$('rf').textContent=tot>0?fmt(tot)+' · '+Math.round(area+bs).toLocaleString('en-PK')+' sqft built'+(bs?' (incl. basement)':'')+' · PKR '+rate.toLocaleString('en-PK')+' / sqft':'';
$('rr').textContent=tot>0?`Likely range: ${short(lo)} – ${short(hi)}`:'';
$('rw').innerHTML=w.map(x=>`<div class="warn">${esc(x)}</div>`).join('')+(ov>0?'<div class="warn">Using your covered-area override instead of the automatic calculation.</div>':'');
const rows=[['Structure',structPart],['Finishing',finPart],['Contingency',cont]].filter(r=>r[1]>0.5),mx=Math.max(...rows.map(r=>r[1]),1);
$('rb').innerHTML=tot>0?rows.map(r=>`<div class="r"><span>${r[0]}</span><div class="b"><i style="width:${(r[1]/mx*100).toFixed(0)}%"></i></div><span>${short(r[1])}</span></div>`).join(''):'';
const tk=['standard','luxury','supreme'].includes(t),P=tk?[['20%','Booking',.2],['40%','Grey Structure',.4],['30%','Finishing',.3],['10%','Handover',.1]]:[['30%','Booking',.3],['40%','Mid-structure',.4],['30%','Completion',.3]];
$('ms').innerHTML=tot>0?P.map(x=>`<div><b>${x[0]}</b>${x[1]}<br>${short(tot*x[2])}</div>`).join(''):'';
$('rwa').href=wa(`Hello Al-Quds, I used the calculator:\nPlot: ${size} ${unit==20?'kanal':'marla'} (${Math.round(plot)} sqft)\nFloors: ${fl}${bs?' + basement':''}\nType: ${CL[t]}\nCovered area: ${Math.round(area+bs)} sqft\nEstimate: ${short(tot)} (range ${short(lo)} – ${short(hi)})\nPlease share a detailed quotation.`)}
/* admin */
const rd=()=>{const d=A.draft;['cat','type','title','loc','meta','price','description'].forEach(k=>{const e=$('e_'+k);if(e)d[k]=e.value})};
function compress(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Image conversion failed')),'image/jpeg',.82)};im.onerror=()=>no(new Error('Not a valid image: '+f.name));im.src=u})}
async function addImgs(inp){const fs=[...inp.files];if(!fs.length)return;rd();A.busy=true;toast('Uploading '+fs.length+' image(s)…');
for(const f of fs){try{if(!f.type.startsWith('image/'))throw new Error(f.name+' is not an image');const b=await compress(f),p=crypto.randomUUID()+'.jpg',r=await sb.storage.from(BUCKET).upload(p,b,{contentType:'image/jpeg',cacheControl:'31536000'});if(r.error)throw r.error;A.draft.images.push(sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl)}catch(e){toast(e.message)}}A.busy=false;draw()}
function rmImg(k){rd();A.draft.images.splice(k,1);draw()}
const BGK=[['home','Home hero'],['sale','Buy'],['rent','Rent'],['stay','Stays & Events'],['construction','Construction'],['calc','Calculator'],['contact','Contact'],['admin','Admin panel']];
async function upBg(k,inp){const f=inp.files[0];if(!f)return;try{if(!f.type.startsWith('image/'))throw new Error('Choose an image file');A.busy=true;toast('Uploading…');const b=await compress(f),p='bg/'+k+'-'+crypto.randomUUID()+'.jpg',r=await sb.storage.from(BUCKET).upload(p,b,{contentType:'image/jpeg',cacheControl:'31536000'});if(r.error)throw r.error;const url=sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl,old=S.bg?.[k];await saveData({...S,bg:{...S.bg,[k]:url}});const q=old&&pathOf(old);if(q)sb.storage.from(BUCKET).remove([q])}catch(e){toast('Upload failed: '+(e.message||e))}A.busy=false;draw()}
async function rmBg(k){const old=S.bg?.[k],n={...S.bg};delete n[k];await saveData({...S,bg:n});const q=old&&pathOf(old);if(q)sb.storage.from(BUCKET).remove([q])}
const blank=()=>({cat:'sale',type:'house',title:'',loc:'',meta:'',price:'',description:'',images:[]});
function editL(id){A.edit=id;const i=items.find(x=>x.id==id);A.draft=i?{...i,images:[...(i.images||[])]}:blank();A.orig=[...A.draft.images];draw();scrollTo(0,0)}
const pathOf=u=>{const k='/'+BUCKET+'/';const i=u.indexOf(k);return i<0?null:decodeURIComponent(u.slice(i+k.length).split('?')[0])};
async function saveL(){rd();const d=A.draft;if(!d.title.trim())return toast('Title is required');A.busy=true;
try{const row={cat:d.cat,type:d.type,title:d.title.trim(),loc:d.loc.trim(),meta:d.meta.trim(),price:d.price.trim(),description:d.description.trim(),images:d.images};
const r=A.edit&&A.edit!='new'?await sb.from('listings').update(row).eq('id',A.edit):await sb.from('listings').insert(row);if(r.error)throw r.error;
const gone=A.orig.filter(u=>!d.images.includes(u)).map(pathOf).filter(Boolean);if(gone.length)await sb.storage.from(BUCKET).remove(gone);

async function delL(id){const i=items.find(x=>x.id==id);if(!i||!confirm('Delete “'+i.title+'”? This also removes its images.'))return;try{const r=await sb.from('listings').delete().eq('id',id);if(r.error)throw r.error;const g=(i.images||[]).map(pathOf).filter(Boolean);if(g.length)await sb.storage.from(BUCKET).remove(g);toast('Deleted');await load()}catch(e){toast('Delete failed: '+(e.message||e))}draw()}
async function saveS(){const v=id=>$(id).value.trim(),n={...S};['name','phone','email','addr','h1','hp'].forEach(k=>n[k]=v('s_'+k));n.wa=v('s_wa').replace(/\D/g,'');if(n.wa.length<10)return toast('WhatsApp number must include the country code, digits only');

function saveR(){const n={...S,rates:{...S.rates}};for(const k in n.rates){const x=parseFloat($('r_'+k).value);if(!(x>0))return toast('Enter a valid rate for '+k);n.rates[k]=x}
for(const[k,id,lo,hi]of[['basementMult','r_bm',.5,3],['contingency','r_ct',0,50],['band','r_bn',0,40]]){const x=parseFloat($(id).value);if(!(x>=lo&&x<=hi))return toast(`${k} must be between ${lo} and ${hi}`);n[k]=x}saveData(n)}

async function login(){const e=$('lg_e').value.trim(),p=$('lg_p').value;if(!e||!p)return toast('Enter email and password');A.busy=true;const r=await sb.auth.signInWithPassword({email:e,password:p});A.busy=false;if(r.error)toast(r.error.message=='Invalid login credentials'?'Wrong email or password':r.error.message);else await session(r.data.session)}
async function logout(){clearTimeout(idle);await sb.auth.signOut({scope:'local'});A.user=null;A.ok=false;draw()}
async function session(s){if(s&&view!='admin'){await sb.auth.signOut({scope:'local'});s=null}A.user=s?.user||null;A.ok=false;if(A.user){const r=await sb.from('admins').select('user_id').eq('user_id',A.user.id).maybeSingle();A.ok=!!r.data}A.checked=true;bump();draw()}
function admin(){if(!sb)return `<section><span class="eb">Admin</span><h2 class="serif">Database not connected yet.</h2><p class="lead">Add your Supabase URL and key to <b>config.js</b> (see README.md). Until then the site runs in demo mode.</p></section>`;
if(!A.checked)return `<section><p class="lead">Checking session…</p></section>`;
if(!A.user)return `<section><span class="eb">Admin</span><h2 class="serif">Sign in.</h2><div class="panel" style="max-width:420px"><form onsubmit="event.preventDefault();login()"><label for="lg_e">Email</label><input id="lg_e" type="email" autocomplete="username" required><label for="lg_p">Password</label><input id="lg_p" type="password" autocomplete="current-password" required><p style="margin-top:20px"><button class="btn" ${A.busy?'disabled':''}>Sign in</button></p></form></div></section>`;
if(!A.ok)return `<section><span class="eb">Admin</span><h2 class="serif">No admin access.</h2><p class="lead">This account is signed in but is not an administrator.</p><p style="margin-top:18px"><button class="btn ghost" onclick="logout()">Sign out</button></p></section>`;
const t=(k,l)=>`<button class="${A.tab==k?'on':''}" onclick="A.tab='${k}';A.edit=null;draw()">${l}</button>`;let b='';
if(A.tab=='items'){if(A.edit){const d=A.draft;b=`<div class="panel"><h3 class="serif" style="font-size:1.6rem">${A.edit=='new'?'Add listing':'Edit listing'}</h3><div class="f"><div><label for="e_cat">Category</label><select id="e_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${d.cat==k?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="e_type">Type</label><select id="e_type">${TYPES.map(k=>`<option value="${k}" ${d.type==k?'selected':''}>${LBL[k]}</option>`).join('')}</select></div>${[['title','Title'],['loc','Location / size'],['meta','Details'],['price','Price']].map(([k,l])=>`<div><label for="e_${k}">${l}</label><input id="e_${k}" value="${esc(d[k])}"></div>`).join('')}</div><label for="e_description">Description</label><textarea id="e_description" rows="4">${esc(d.description)}</textarea>
<label>Images (the first is the cover)</label><input type="file" accept="image/*" multiple onchange="addImgs(this)" ${A.busy?'disabled':''}><div class="th">${d.images.map((u,k)=>`<div><img src="${esc(u)}" alt=""><button type="button" onclick="rmImg(${k})" aria-label="Remove image">×</button></div>`).join('')}</div>
<p style="margin-top:22px"><button class="btn" onclick="saveL()" ${A.busy?'disabled':''}>Save listing</button><button class="btn ghost" onclick="A.edit=null;draw()">Cancel</button></p></div>`}
else b=`<p style="margin-top:22px"><button class="btn" onclick="editL('new')">+ Add listing</button></p><div class="panel"><table><tr><th></th><th>Title</th><th>Category</th><th>Type</th><th>Price</th><th></th></tr>${items.map(i=>`<tr><td>${i.images?.[0]?`<img src="${esc(i.images[0])}" alt="">`:''}</td><td>${esc(i.title)}</td><td>${CATS[i.cat]}</td><td>${esc(LBL[i.type]||i.type)}</td><td>${esc(i.price)}</td><td><button class="btn sm ghost" onclick="editL('${i.id}')">Edit</button><button class="btn sm red" onclick="delL('${i.id}')">Delete</button></td></tr>`).join('')||'<tr><td>No listings yet</td></tr>'}</table></div>`}
else if(A.tab=='site')b=`<div class="panel"><h3 class="serif" style="font-size:1.6rem">Site text &amp; contact</h3><div class="f">${[['name','Brand name'],['phone','Phone (displayed)'],['wa','WhatsApp number (digits, with country code)'],['email','Email'],['addr','Address line']].map(([k,l])=>`<div><label for="s_${k}">${l}</label><input id="s_${k}" value="${esc(S[k])}"></div>`).join('')}</div><label for="s_h1">Hero headline</label><input id="s_h1" value="${esc(S.h1)}"><label for="s_hp">Hero paragraph</label><textarea id="s_hp" rows="3">${esc(S.hp)}</textarea><h3 class="serif" style="margin-top:24px">Homepage stats</h3><div class="f">${S.stats.map((x,i)=>`<div><label>Stat ${i+1}</label><input id="st${i}a" value="${esc(x[0])}"><input id="st${i}b" value="${esc(x[1])}" style="margin-top:6px"></div>`).join('')}</div><p style="margin-top:20px"><button class="btn" onclick="saveS()">Save</button></p></div><div class="panel"><h3 class="serif" style="font-size:1.6rem">Page background photos</h3><p class="small">Upload a wide photo (landscape works best) for each page banner. Without one, a default skyline illustration is shown.</p><div class="f">${BGK.map(([k,l])=>`<div><label>${l}</label>${S.bg?.[k]?`<div class="th"><div><img src="${esc(S.bg[k])}" alt=""><button type="button" onclick="rmBg('${k}')" aria-label="Remove">×</button></div></div>`:''}<input type="file" accept="image/*" onchange="upBg('${k}',this)" ${A.busy?'disabled':''}></div>`).join('')}</div></div>`;

/* render */
function draw(anim){nav();if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&view=='admin'&&0)return;

if(view=='calc'){const c=$('cc');c.dataset.m='';['cs','cu','cm','cf','cb','ct','co'].forEach(i=>{$(i).oninput=$(i).onchange=()=>{if(['cs','cu','cm'].includes(i))c.dataset.m='';recalc()}});c.oninput=()=>{c.dataset.m='1';recalc()};recalc()}}

(async()=>{draw();await load();draw();if(sb){const{data}=await sb.auth.getSession();await session(data.session);sb.auth.onAuthStateChange((ev,s)=>{if(ev=='SIGNED_OUT'){A.user=null;A.ok=false;draw()}})}})();
</script></body></html>
